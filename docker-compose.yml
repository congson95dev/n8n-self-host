version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n_inet372 -d n8n_inet372"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: postgres -c 'timezone=Asia/Ho_Chi_Minh'
    networks:
      - n8n-network

  n8n:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: n8n
    user: "0:0"
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASS}
      - N8N_RUNNERS_ENABLED=true
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${DB_NAME}
      - DB_POSTGRESDB_USER=${DB_USER}
      - DB_POSTGRESDB_PASSWORD=${DB_PASS}
      - N8N_HOST=${DOMAIN}
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - WEBHOOK_URL=https://${DOMAIN}/
      - N8N_EDITOR_BASE_URL=https://${DOMAIN}/
      - N8N_PUBLIC_API_HOST=${DOMAIN}
      - VUE_APP_URL_BASE_API=https://${DOMAIN}/
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - TZ=Asia/Ho_Chi_Minh
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n
      - ./telegram-bot-api/data:/data:rw
    networks:
      - n8n-network

  telegram-bot-api:
    build:
      context: ./telegram-bot-api
    container_name: telegram-bot-api
    ports:
      - "8081:8081"
    volumes:
      - ./telegram-bot-api/data:/data
    command: >
      ./telegram-bot-api
      --api-id=${API_ID}
      --api-hash=${API_HASH}
      --http-port=8081
      --dir=/data
      --local
    networks:
      - n8n-network
    restart: unless-stopped

networks:
  n8n-network:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
