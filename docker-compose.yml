version: "3.8"

x-n8n-env: &n8n-env
  GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
  TZ: Asia/Ho_Chi_Minh
  EXECUTIONS_MODE: queue
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: 5432
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: n8n
  DB_POSTGRESDB_PASSWORD: n8n
  QUEUE_BULL_REDIS_HOST: redis
  QUEUE_BULL_REDIS_PORT: 6379
  N8N_ENCRYPTION_KEY: P6QhfMJONZnzDLKv+Pvlf+35ZXESD5SW
  N8N_RUNNERS_ENABLED: "true"
  N8N_RUNNERS_MODE: internal
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
  # N8N_LOG_LEVEL: debug
  N8N_LISTEN_ADDRESS: "0.0.0.0" # listen as ipv4

x-n8n-common-volumes: &n8n-common-volumes
  - /home/vmo/Downloads/downloads:/tmp/downloads
  - /home/vmo/Downloads/combine-video:/tmp/combine-video
  - /home/vmo/Downloads/final-video-1:/tmp/final-video-1
  - /home/vmo/Downloads/final-video-2:/tmp/final-video-2
  - /home/vmo/Downloads/final-video-3:/tmp/final-video-3
  - /home/vmo/Downloads/final-video-4:/tmp/final-video-4
  - /home/vmo/Downloads/combine-download-video-1:/tmp/combine-download-video-1
  - /home/vmo/Downloads/combine-download-video-2:/tmp/combine-download-video-2
  - /home/vmo/Downloads/combine-final-video-1:/tmp/combine-final-video-1
  - /home/vmo/Downloads/combine-final-video-2:/tmp/combine-final-video-2

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n
      POSTGRES_DB: n8n
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped

  python-runner:
    build:
      context: .
      dockerfile: Dockerfile.python
    ports:
      - "5000:5000"
    volumes: *n8n-common-volumes
    restart: unless-stopped

  folders-watcher:
    build:
      context: .
      dockerfile: Dockerfile.watcher
    volumes: *n8n-common-volumes
    restart: unless-stopped
    depends_on:
      - n8n
    environment:
      WEBHOOK_URL: "http://n8n-self-host-n8n-1:5678/webhook/folder-watcher"
      FOLDERS_TO_WATCH: "/tmp/combine-download-video-1/,/tmp/combine-download-video-2/"  

  n8n:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5678:5678"
    environment:
      <<: *n8n-env
      NODE_ENV: production
      N8N_CONCURRENCY_PRODUCTION_LIMIT: 2
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

  n8n-worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    command: worker
    environment:
      <<: *n8n-env
      N8N_CONCURRENCY_PRODUCTION_LIMIT: 5
    restart: unless-stopped
    volumes: *n8n-common-volumes
    depends_on:
      - postgres
      - redis

  n8n-worker-2:
    build:
      context: .
      dockerfile: Dockerfile
    command: worker
    environment:
      <<: *n8n-env
      N8N_CONCURRENCY_PRODUCTION_LIMIT: 5
    restart: unless-stopped
    volumes: *n8n-common-volumes
    depends_on:
      - postgres
      - redis

  n8n-worker-3:
    build:
      context: .
      dockerfile: Dockerfile
    command: worker
    environment:
      <<: *n8n-env
      N8N_CONCURRENCY_PRODUCTION_LIMIT: 5
    restart: unless-stopped
    volumes: *n8n-common-volumes
    depends_on:
      - postgres
      - redis

  n8n-worker-4:
    build:
      context: .
      dockerfile: Dockerfile
    command: worker
    environment:
      <<: *n8n-env
      N8N_CONCURRENCY_PRODUCTION_LIMIT: 5
    restart: unless-stopped
    volumes: *n8n-common-volumes
    depends_on:
      - postgres
      - redis

volumes:
  n8n_data:
  pgdata:
